version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: shamba_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shamba
      POSTGRES_USER: shamba
      POSTGRES_PASSWORD: shamba
    ports:
      - "5432:5432"
    volumes:
      - shamba_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: shamba_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - shamba_redis_data:/data

volumes:
  shamba_postgres_data:
  shamba_redis_data:
